<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Atualizações · Artificial Culture</title><style>body{margin:0;background:#ece3d6;color:#292520;font:18px/1.65 system-ui}main{max-width:880px;margin:auto;padding:60px 24px}a{color:#715943}h1{font-size:clamp(38px,7vw,70px);line-height:1.08}article{border-top:1px solid #715943;padding:32px 0}small{color:#715943}button{background:transparent;color:inherit;border:1px solid #715943;padding:10px 16px;border-radius:4px;cursor:pointer}header{display:flex;justify-content:space-between;gap:20px}.notice{padding:20px;border:1px solid #715943}p{max-width:75ch}</style><main><header><a href="./">← Artificial Culture</a><button id="lang">English</button></header><h1 id="title">Patch notes & alterações</h1><p id="intro">Mecânicas explicadas, mudanças verificadas e limites do desenvolvimento.</p><p class="notice" id="notice">Em desenvolvimento. Uma nota de protótipo ou experimento não representa uma versão pública disponível.</p><div id="entries"></div><p>Sympath · Artificial Culture</p></main><script>let lang='pt';let data;function render(){document.documentElement.lang=lang==='pt'?'pt-BR':'en';document.getElementById('lang').textContent=lang==='pt'?'English':'Português';document.getElementById('title').textContent=lang==='pt'?'Patch notes & alterações':'Patch notes & changes';document.getElementById('intro').textContent=lang==='pt'?'Mecânicas explicadas, mudanças verificadas e limites do desenvolvimento.':'Mechanics explained, verified changes and development limitations.';document.getElementById('notice').textContent=lang==='pt'?'Em desenvolvimento. Uma nota de protótipo ou experimento não representa uma versão pública disponível.':'In development. Prototype and experimental notes do not announce a publicly playable release.';const list=document.getElementById('entries');list.replaceChildren();for(const e of data.entries){const a=document.createElement('article'),s=document.createElement('small'),h=document.createElement('h2'),p=document.createElement('p');s.textContent=e.date+' · '+e.state;h.textContent=e.title;p.textContent=e[lang];a.append(s,h,p);list.append(a)}}fetch('updates.json').then(r=>r.json()).then(d=>{data=d;render()});document.getElementById('lang').onclick=()=>{lang=lang==='pt'?'en':'pt';render()};</script></html>
